<svg viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tally — AI revenue recovery for Razorpay merchants. Turn failed payments into real revenue.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="38%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242b40"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <linearGradient id="glassHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="30%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#05060a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="480" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="480" fill="url(#glow)"/>

  <!-- floating scene: failed card -> recovery arc -> revenue panel -->
  <g>
    <!-- recovery arc, drawn behind the chips it connects -->
    <path d="M 345,242 C 430,70 650,70 822,238" fill="none" stroke="url(#greenLine)" stroke-width="10" stroke-linecap="round" opacity="0.35" filter="url(#soft)"/>
    <path d="M 345,242 C 430,70 650,70 822,238" fill="none" stroke="url(#greenLine)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="404" cy="128" r="4.5" fill="#a3e635"/>
    <circle cx="486" cy="82" r="4" fill="#4ade80"/>
    <circle cx="582" cy="76" r="4" fill="#34d399"/>
    <circle cx="676" cy="98" r="4" fill="#10b981"/>
    <circle cx="748" cy="152" r="4.5" fill="#10b981"/>

    <!-- incoming failure line -->
    <path d="M 158,128 C 190,140 210,150 226,168" fill="none" stroke="url(#redLine)" stroke-width="6" stroke-linecap="round" opacity="0.35" filter="url(#soft)"/>
    <path d="M 158,128 C 190,140 210,150 226,168" fill="none" stroke="url(#redLine)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 216,158 L 226,168 L 213,172" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- failed payment chip -->
    <g>
      <rect x="70" y="96" width="176" height="46" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="70" y="96" width="176" height="20" rx="10" fill="url(#glassHi)"/>
      <path d="M 90,120 L 102,110 L 112,118 L 128,102" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 128,102 L 129,113 L 118,111" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="144" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5" fill="#fda4af">PAYMENT FAILED</text>
    </g>

    <!-- the broken card -->
    <g transform="rotate(-7 280 230)">
      <rect x="180" y="165" width="200" height="130" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14" filter="url(#soft2)"/>
      <rect x="180" y="165" width="200" height="130" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="180" y="165" width="200" height="46" rx="18" fill="url(#glassHi)"/>
      <rect x="203" y="196" width="36" height="26" rx="5" fill="url(#chip)"/>
      <rect x="203" y="252" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="203" y="270" width="76" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M 231,165 L 206,206 L 251,222 L 214,262 L 259,296" fill="none" stroke="#fecdd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      <circle cx="231" cy="165" r="9" fill="#f43f5e" opacity="0.55" filter="url(#soft)"/>
      <circle cx="231" cy="165" r="3.5" fill="#fecaca"/>
    </g>

    <!-- recovered chip, riding the arc's peak -->
    <g>
      <rect x="486" y="46" width="150" height="46" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14" filter="url(#soft)"/>
      <rect x="486" y="46" width="150" height="46" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="486" y="46" width="150" height="19" rx="9" fill="url(#glassHi)"/>
      <circle cx="510" cy="69" r="11" fill="#10b981" fill-opacity="0.18"/>
      <path d="M 505,69 L 509,74 L 517,63" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="529" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5" fill="#6ee7b7">RECOVERED</text>
    </g>

    <!-- higher revenue panel -->
    <g>
      <rect x="800" y="152" width="190" height="150" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14" filter="url(#soft2)"/>
      <rect x="800" y="152" width="190" height="150" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="800" y="152" width="190" height="42" rx="18" fill="url(#glassHi)"/>
      <text x="822" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#cbd5e1">HIGHER REVENUE</text>
      <rect x="826" y="252" width="22" height="34" rx="4" fill="#134e33"/>
      <rect x="860" y="230" width="22" height="56" rx="4" fill="#0f7a52"/>
      <rect x="894" y="204" width="22" height="82" rx="4" fill="#10b981"/>
      <rect x="928" y="216" width="22" height="70" rx="4" fill="#34d399"/>
      <path d="M 824,240 L 858,220 L 892,196 L 950,204" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      <path d="M 938,196 L 950,204 L 940,214" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>

    <!-- small supporting chips: the pipeline this all rides on -->
    <g opacity="0.92">
      <rect x="330" y="336" width="150" height="40" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="352" cy="356" r="7" fill="#6366f1" fill-opacity="0.35"/>
      <circle cx="352" cy="356" r="3" fill="#a5b4fc"/>
      <text x="368" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#c7d2fe">Guardrails checked</text>
    </g>
    <g opacity="0.92">
      <rect x="520" y="352" width="150" height="40" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="542" cy="372" r="7" fill="#8b5cf6" fill-opacity="0.35"/>
      <circle cx="542" cy="372" r="3" fill="#ddd6fe"/>
      <text x="558" y="377" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#ddd6fe">Agent decided</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="1050" y1="70" x2="1050" y2="410" stroke="url(#divider)" stroke-width="1.5"/>

  <!-- wordmark -->
  <g>
    <text x="1092" y="196" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#a5b4fc">AI REVENUE RECOVERY</text>
    <text x="1088" y="288" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="1" fill="url(#chrome)">Tally</text>
    <rect x="1092" y="316" width="64" height="3" rx="1.5" fill="#10b981"/>
    <text x="1092" y="356" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">TURN FAILED PAYMENTS</text>
    <text x="1092" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">INTO REAL REVENUE</text>
  </g>

  <!-- bottom fade so the banner dissolves into the page instead of ending in a hard edge -->
  <rect x="0" y="400" width="1600" height="80" fill="url(#bottomFade)"/>
</svg>
