<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tally — AI revenue recovery for Razorpay merchants">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0B12"/>
      <stop offset="0.55" stop-color="#12131C"/>
      <stop offset="1" stop-color="#0D0E16"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7CBD1"/>
    </linearGradient>
    <linearGradient id="ring" x1="66" y1="0" x2="1134" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4B4F58"/>
    </marker>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect x="620" width="580" height="400" fill="url(#dots)"/>

  <!-- ambient colour, drawn from the same tones the dashboard itself uses:
       emerald for money coming back, violet for the agent, indigo for the
       guardrails, amber for a case that still needs someone's attention. -->
  <circle cx="1060" cy="80" r="230" fill="#10B981" opacity="0.11"/>
  <circle cx="880" cy="300" r="190" fill="#8B5CF6" opacity="0.09"/>
  <circle cx="150" cy="380" r="210" fill="#6366F1" opacity="0.07"/>
  <circle cx="980" cy="360" r="120" fill="#F59E0B" opacity="0.06"/>
  <text x="1010" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="360" fill="#FFFFFF" opacity="0.025" text-anchor="middle">₹</text>

  <!-- wordmark -->
  <rect x="64" y="60" width="56" height="56" rx="14" fill="url(#badge)"/>
  <path d="M78 88l8 8 16-18" stroke="#0A0B0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="136" y="104" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" fill="#FFFFFF">Tally</text>

  <text x="66" y="148" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="13" letter-spacing="2.5" fill="#9AA0AC">AI REVENUE RECOVERY FOR RAZORPAY MERCHANTS</text>

  <line x1="66" y1="174" x2="556" y2="174" stroke="url(#ring)" stroke-width="1"/>

  <text x="66" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C7CBD1">A failed payment isn't one problem — Tally works out</text>
  <text x="66" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C7CBD1">which one it is, recovers it, and can prove that it worked.</text>

  <!-- stat chips, two rows so a fourth one had somewhere honest to go -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="66" y="264" width="118" height="32" rx="16" fill="#1B1D22" stroke="#2A2D34"/>
    <circle cx="85" cy="280" r="4" fill="#10B981"/>
    <text x="97" y="285" font-size="12.5" fill="#D5D8DE">Multi-tenant</text>

    <rect x="196" y="264" width="152" height="32" rx="16" fill="#1B1D22" stroke="#2A2D34"/>
    <circle cx="215" cy="280" r="4" fill="#6366F1"/>
    <text x="227" y="285" font-size="12.5" fill="#D5D8DE">Guardrailed by code</text>

    <rect x="66" y="306" width="128" height="32" rx="16" fill="#1B1D22" stroke="#2A2D34"/>
    <circle cx="85" cy="322" r="4" fill="#0EA5E9"/>
    <text x="97" y="327" font-size="12.5" fill="#D5D8DE">381 tests green</text>

    <rect x="206" y="306" width="176" height="32" rx="16" fill="#1B1D22" stroke="#2A2D34"/>
    <circle cx="225" cy="322" r="4" fill="#8B5CF6"/>
    <text x="237" y="327" font-size="12.5" fill="#D5D8DE">Measured, not assumed</text>
  </g>

  <!-- recovery pipeline: preflight guardrails, then the model, then the
       clamp - the same order the worker itself runs them in -->
  <text x="965" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12.5" letter-spacing="1.8" fill="#7A808B" text-anchor="middle">THE AGENT PROPOSES · THE GUARDRAILS DISPOSE</text>

  <path d="M694 150 L766 150" stroke="#4B4F58" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M834 150 L921 150" stroke="#4B4F58" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M959 150 L1046 150" stroke="#4B4F58" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <circle cx="660" cy="150" r="30" fill="#FB7185"/>
  <path d="M648 138l24 24M672 138l-24 24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <text x="660" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9AA0AC" text-anchor="middle">Failed</text>

  <circle cx="800" cy="150" r="30" fill="#6366F1"/>
  <path d="M792 138v24M808 138v24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <text x="800" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9AA0AC" text-anchor="middle">Guardrails</text>

  <path d="M940 130l4.5 9.5 10.5 1.5-7.5 7.5 1.5 10.5-9-5-9 5 1.5-10.5-7.5-7.5 10.5-1.5z" fill="#8B5CF6"/>
  <text x="940" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9AA0AC" text-anchor="middle">Agent decides</text>

  <circle cx="1080" cy="150" r="30" fill="#10B981"/>
  <path d="M1066 150l10 10 18-20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="1080" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9AA0AC" text-anchor="middle">Recovered</text>

  <!-- mini recovered-vs-held-back bars: the actual measurement this session
       added, not only the send-and-hope figure the first banner drew -->
  <g opacity="0.9">
    <rect x="694" y="352" width="12" height="18" rx="2" fill="#4B4F58" opacity="0.7"/>
    <rect x="714" y="340" width="12" height="30" rx="2" fill="#4B4F58" opacity="0.7"/>
    <rect x="734" y="322" width="12" height="48" rx="2" fill="#4B4F58" opacity="0.7"/>
    <text x="742" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#5B6069" text-anchor="middle">CONTROL</text>

    <rect x="774" y="330" width="12" height="40" rx="2" fill="#10B981" opacity="0.55"/>
    <rect x="794" y="300" width="12" height="70" rx="2" fill="#10B981" opacity="0.75"/>
    <rect x="814" y="254" width="12" height="116" rx="2" fill="#10B981"/>
    <text x="800" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#5B6069" text-anchor="middle">SENT</text>
  </g>
  <line x1="758" y1="254" x2="758" y2="370" stroke="#2A2D34" stroke-width="1"/>
  <text x="852" y="365" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#8B5CF6">+ lift</text>

  <text x="1136" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6069" text-anchor="end">Next.js · Supabase · Razorpay · Claude / Gemini</text>
</svg>
